name: SmartCraftWarehouse
version: '1.5.0'
main: com.naokibot.smartcraft.SmartCraftWarehousePlugin
api-version: '1.21'
author: naokibot
description: Japanese/English item search, favorites, recipe GUI, and owned material chest management for Spigot 1.21.1
commands:
  sc:
    description: Opens the SmartCraft GUI
    usage: /sc
    permission: smartcraft.use
    aliases: [smartcraftwarehouse]
  scraft:
    description: Legacy SmartCraft command
    usage: /scraft
    permission: smartcraft.use
  s:
    description: Shows information about the item in the main hand
    usage: /s i
    permission: smartcraft.use
permissions:
  smartcraft.use:
    default: true
  smartcraft.storage:
    default: true
  smartcraft.admin:
    default: op
