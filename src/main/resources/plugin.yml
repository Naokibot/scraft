name: SmartCraftWarehouse
version: '1.4.4'
main: com.sagakenichi.smartcraft.SmartCraftWarehousePlugin
api-version: '1.21'
author: sagakenichi
description: SmartCraft GUI and owned material chest management for Spigot 1.21.1
commands:
  sc:
    description: Opens the SmartCraft GUI
    usage: /sc
    permission: smartcraft.use
    aliases: [smartcraftwarehouse]
  scraft:
    description: Legacy SmartCraft command
    usage: /scraft
    permission: smartcraft.use
permissions:
  smartcraft.use:
    default: true
  smartcraft.storage:
    default: true
  smartcraft.admin:
    default: op
